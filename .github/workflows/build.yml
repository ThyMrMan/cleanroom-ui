# Build and test on every push: the plugin, translations and movies (the Flex SDK and playerglobal fetched and
# hash-checked by crui.flex, then cached), the movie check, and the tests. The Papyrus scripts and the DLLs need
# Fallout 4 and Visual Studio, so they are built locally; their tests skip here.
# See: docs/swf_framework.md#mxmlc-setup
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Cache the Flex downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flex/downloads
          key: flex-4.16.1-playerglobal-11.2
      - name: Install the Flex SDK
        run: python -m crui.flex "$env:RUNNER_TEMP/flex/sdk" --downloads "$env:RUNNER_TEMP/flex/downloads"
      - name: Point the build at it
        run: '"CRUI_FLEX=$env:RUNNER_TEMP/flex/sdk" >> $env:GITHUB_ENV'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Build
        run: python -m crui plugin translations movies --out dist/CleanroomUI
      - name: Movie check
        run: python -m crui check
      - name: Tests
        run: python -m pytest -q
