; Cleanroom UI's MCM defaults. Don't edit this file: MCM saves your changes to Data\MCM\Settings\CleanroomUI.ini,
; which wins over Data\F4SE\Plugins\CleanroomUI.ini. Each default here is the DLL's own.

[Hud]
; Keep the HUD layout with each save (1), or share one layout between every save (0). Applies after a restart.
bLayoutPerSave=1
; Arrange the game's HUD as Fallout: New Vegas does. sPreset in CleanroomUI.ini, when set, wins.
bFnvPreset=0
; Hide HUD parts while they aren't needed. sShow in CleanroomUI.ini, when set, wins.
bImmersive=0
; Seconds a part stays after its last condition ends.
fShowLinger=3.0

[Keys]
; A letter, a digit or F1 to F12.
sHudReset=R
sHudHide=H
sHudColor=C
sHudShow=V
sHudBackup=K
sHudRestore=L
sHudPeek=Y
sRepair=G
sAmmo=B
